llm:
  model: "claude-haiku-4-5-20251001"
  temperature: 0.1
  max_tokens: 400
  retry_temperature: 0.0
  max_retries: 2
  confidence_threshold: 0.65

evaluation:
  n_cases_per_category: 10
  judge_model: "claude-haiku-4-5-20251001"
  difficulty_distribution:
    easy: 0.25
    medium: 0.50
    hard: 0.25
  auto_run_on_startup: false

feedback_loop:
  trigger_mode: "manual"
  auto_threshold: 10
  min_per_category: 2
  max_examples_per_category: 2
  notify_admin: true
